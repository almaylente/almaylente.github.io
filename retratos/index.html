<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retratos | Alma y Lente</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f5f1eb;font-family:Arial,sans-serif}
header{padding:25px 7%;border-bottom:1px solid #38332d}
a{color:inherit;text-decoration:none}
.logo{font-family:Georgia,serif;font-size:27px;font-style:italic}
small{display:block;font-size:9px;letter-spacing:2px;margin-top:6px}
main{width:86%;max-width:1250px;margin:50px auto}
.etiqueta{color:#c9a873;font-size:10px;letter-spacing:3px;text-transform:uppercase}
h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,65px);font-weight:normal}
.intro{color:#b9b3aa;font-size:13px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid a{display:block;aspect-ratio:3/4;background:#222}
.grid img{width:100%;height:100%;object-fit:cover}
.volver{display:inline-block;margin-top:35px;padding:12px 18px;border:1px solid #c9a873;color:#c9a873;font-size:11px}
footer{text-align:center;padding:25px;color:#b9b3aa;font-size:10px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}main{width:90%}}
</style>
</head>
<body>
<header>
<a class="logo" href="../">Alma y Lente
<small>FOTOGRAFÍA · RETOQUE · ARTE DIGITAL</small>
</a>
</header>
<main>
<span class="etiqueta">Portafolio · Colección 01</span>
<h1>Retratos</h1>
<p class="intro">Retratos que cuentan historias.</p>
<div class="grid">
<a href="../retrato1.jpg" target="_blank">
<img src="../retrato1.jpg" alt="Retrato 1">
</a>
<a href="../retrato2.jpg" target="_blank">
<img src="../retrato2.jpg" alt="Retrato 2">
</a>
</div>
<a class="volver" href="../">← Volver a Alma y Lente</a>
</main>
<footer>© 2026 Alma y Lente</footer>
</body>
</html>
